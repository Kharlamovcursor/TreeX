<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Genealogy Tree (relatives-tree)</title>
    <style>
      :root {
        --card-gap: 12px;
      }
      .tree-root {
        position: relative;
        overflow: auto;
        width: 100%;
        height: 100vh;
        background: #0b1220;
      }
      .tree-lines {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .tree-cards {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      .person-card {
        position: absolute;
        box-sizing: border-box;
        border-radius: 12px;
        padding: 10px 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        font-family: system-ui, sans-serif;
      }
      .person-card.male {
        background: linear-gradient(180deg, #1a2a44, #152238);
        border: 1px solid #3d6ea8;
      }
      .person-card.female {
        background: linear-gradient(180deg, #3a2230, #2a1824);
        border: 1px solid #a85a72;
      }
      .person-card.other {
        background: #1e2838;
        border: 1px solid #666;
      }
      .person-card .name {
        font-size: 15px;
        font-weight: 700;
        color: #f5f7fa;
      }
      .person-card .dates {
        font-size: 12px;
        color: #9aa8bc;
        margin-top: 4px;
      }
    </style>
    <script src="../assets/genealogy-tree/calc-tree.js"></script>
  </head>
  <body>
    <div id="root" class="tree-root"></div>
    <script type="module">
      import { renderTree } from './treeRender.js';
      window.renderDemoTree = renderTree;
    </script>
  </body>
</html>
